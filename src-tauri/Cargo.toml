[package]
name = "dlsite-manager"
version = "3.2.2"
description = "Desktop manager for DLsite works and libraries."
authors = ["AcrylicShrimp"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dlsite_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-trait = "0.1.92"
dm-api = { path = "../crates/dm-api" }
dm-audit = { path = "../crates/dm-audit" }
dm-credentials = { path = "../crates/dm-credentials" }
dm-download = { path = "../crates/dm-download" }
dm-jobs = { path = "../crates/dm-jobs" }
dm-library = { path = "../crates/dm-library" }
dm-storage = { path = "../crates/dm-storage" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
tauri-plugin-dialog = "2.7.3"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[lints]
workspace = true
