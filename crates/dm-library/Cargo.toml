[package]
name = "dm-library"
version = "3.2.2"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
dm-api = { path = "../dm-api" }
dm-credentials = { path = "../dm-credentials" }
dm-download = { path = "../dm-download" }
dm-jobs = { path = "../dm-jobs" }
dm-storage = { path = "../dm-storage" }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "rt", "sync", "time"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"

[lints]
workspace = true
