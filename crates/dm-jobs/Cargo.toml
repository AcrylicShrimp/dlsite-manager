[package]
name = "dm-jobs"
version = "3.2.2"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
