name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as v3.0.1 or v3.0.1-rc.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: "10.17.1"

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag, branch, and versions
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Release tag must look like v3.0.1 or v3.0.1-rc.1; got ${TAG}"
            exit 1
          fi

          git fetch --force origin \
            "refs/heads/release:refs/remotes/origin/release" \
            "refs/tags/${TAG}:refs/tags/${TAG}"

          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/release; then
            echo "::error::${TAG} must point to a commit reachable from origin/release"
            exit 1
          fi

          git checkout --detach "${TAG_COMMIT}"

          TAG_VERSION="${TAG#v}"
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          CARGO_VERSION="$(node -e "const fs = require('fs'); const text = fs.readFileSync('src-tauri/Cargo.toml', 'utf8'); const match = text.match(/^version\\s*=\\s*\"([^\"]+)\"/m); if (!match) process.exit(1); console.log(match[1]);")"

          if [[ "${TAG_VERSION}" != "${APP_VERSION}" ]]; then
            echo "::error::Tag version ${TAG_VERSION} does not match src-tauri/tauri.conf.json version ${APP_VERSION}"
            exit 1
          fi
          if [[ "${APP_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "::error::src-tauri/tauri.conf.json version ${APP_VERSION} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi
          if [[ "${APP_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "::error::src-tauri/tauri.conf.json version ${APP_VERSION} does not match src-tauri/Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi

          if [[ "${TAG_VERSION}" == *"-rc."* ]]; then
            PRERELEASE="true"
            DRAFT="false"
          else
            PRERELEASE="false"
            DRAFT="true"
          fi

          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required for updater artifact signing"
            exit 1
          fi

          {
            echo "tag=${TAG}"
            echo "version=${TAG_VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "draft=${DRAFT}"
          } >> "${GITHUB_OUTPUT}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
            artifact-name: dlsite-manager-macos
          - label: Windows
            os: windows-latest
            artifact-name: dlsite-manager-windows
          - label: Linux
            os: ubuntu-22.04
            artifact-name: dlsite-manager-linux
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${BUNDLES}" ]]; then
            pnpm tauri build --bundles "${BUNDLES}"
          else
            pnpm tauri build
          fi

      - name: Repack AppImage without the bundled Wayland client library
        if: runner.os == 'Linux'
        shell: bash
        env:
          # Pinned to an immutable release tag instead of the mutable `continuous` one: this job
          # runs the downloaded binary with `contents: write`, so the bytes must not be able to
          # change under us. Bump the tag and the checksum together.
          APPIMAGE_PLUGIN_TAG: 1-alpha-20250213-1
          APPIMAGE_PLUGIN_SHA256: 992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3
        run: |
          set -euo pipefail

          # linuxdeploy bundles libwayland-client.so.0 even though the AppImage excludelist
          # rejects it. The host mesa EGL driver is then linked against the older bundled copy,
          # fails to resolve symbols such as wl_fixes_interface, and WebKitGTK aborts with
          # "Could not create default EGL display: EGL_BAD_PARAMETER" on every distribution
          # whose libwayland is newer than the build image.
          BUNDLE_DIR="target/release/bundle/appimage"

          APPDIR="$(find "${BUNDLE_DIR}" -maxdepth 1 -type d -name '*.AppDir' -printf '%f\n' | head -1)"
          APPIMAGE="$(find "${BUNDLE_DIR}" -maxdepth 1 -type f -name '*.AppImage' -printf '%f\n' | head -1)"
          if [[ -z "${APPDIR}" || -z "${APPIMAGE}" ]]; then
            echo "::error::Expected an AppDir and an AppImage in ${BUNDLE_DIR}"
            exit 1
          fi

          if ! compgen -G "${BUNDLE_DIR}/${APPDIR}/usr/lib/libwayland-client.so.*" >/dev/null; then
            echo "::notice::No bundled libwayland-client found; keeping the AppImage as built"
            exit 0
          fi
          rm -f "${BUNDLE_DIR}/${APPDIR}"/usr/lib/libwayland-client.so.*

          PLUGIN="${RUNNER_TEMP}/linuxdeploy-plugin-appimage.AppImage"
          curl --fail --location --silent --show-error --output "${PLUGIN}" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/${APPIMAGE_PLUGIN_TAG}/linuxdeploy-plugin-appimage-x86_64.AppImage"
          echo "${APPIMAGE_PLUGIN_SHA256}  ${PLUGIN}" | sha256sum --check --strict -
          chmod +x "${PLUGIN}"

          rm -f "${BUNDLE_DIR}/${APPIMAGE}"
          (
            cd "${BUNDLE_DIR}"
            ARCH=x86_64 OUTPUT="${APPIMAGE}" APPIMAGE_EXTRACT_AND_RUN=1 \
              "${PLUGIN}" --appdir "${APPDIR}"
          )
          rm -f "${PLUGIN}"
          test -f "${BUNDLE_DIR}/${APPIMAGE}"

      # `tauri build` signs the AppImage it produces, but the repack above rewrites those bytes,
      # so the bundler signature no longer matches the artifact that actually ships. Signing here
      # rather than inside the repack step keeps the AppImage signed even when the repack is
      # skipped because no bundled libwayland-client was found.
      - name: Sign the AppImage that will be published
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUNDLE_DIR="target/release/bundle/appimage"

          APPIMAGE="$(find "${BUNDLE_DIR}" -maxdepth 1 -type f -name '*.AppImage' -printf '%f\n' | head -1)"
          if [[ -z "${APPIMAGE}" ]]; then
            echo "::error::Expected an AppImage in ${BUNDLE_DIR}"
            exit 1
          fi

          rm -f "${BUNDLE_DIR}/${APPIMAGE}.sig"
          pnpm tauri signer sign "${BUNDLE_DIR}/${APPIMAGE}"
          test -f "${BUNDLE_DIR}/${APPIMAGE}.sig"

      - name: Collect release artifacts
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact-name }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");

          const bundleRoot = path.join("target", "release", "bundle");
          const outputDir = path.join("dist", "release");
          const allowedExtensions = new Set([".dmg", ".msi", ".exe", ".appimage", ".sig"]);
          const allowedSuffixes = [".app.tar.gz"];

          function walk(directory) {
            if (!fs.existsSync(directory)) {
              return [];
            }

            const found = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                found.push(...walk(fullPath));
              } else if (
                allowedExtensions.has(path.extname(entry.name).toLowerCase()) ||
                allowedSuffixes.some((suffix) => entry.name.endsWith(suffix))
              ) {
                found.push(fullPath);
              }
            }
            return found;
          }

          fs.rmSync(outputDir, { recursive: true, force: true });
          fs.mkdirSync(outputDir, { recursive: true });

          const artifacts = walk(bundleRoot);
          if (artifacts.length === 0) {
            console.error(`No release artifacts found below ${bundleRoot}`);
            process.exit(1);
          }

          const checksumLines = [];
          for (const artifact of artifacts) {
            const destination = path.join(outputDir, path.basename(artifact));
            fs.copyFileSync(artifact, destination);

            const hash = crypto.createHash("sha256").update(fs.readFileSync(destination)).digest("hex");
            checksumLines.push(`${hash}  ${path.basename(destination)}`);
          }

          checksumLines.sort();
          fs.writeFileSync(
            path.join(outputDir, `${process.env.ARTIFACT_NAME}-SHA256SUMS.txt`),
            `${checksumLines.join("\n")}\n`,
          );
          NODE

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/release
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -euo pipefail

          mapfile -d "" files < <(find dist/release -type f -print0 | sort -z)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No release files were downloaded"
            exit 1
          fi

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const releaseDir = path.join("dist", "release");
          const repo = process.env.GH_REPO;
          const tag = process.env.TAG;
          const version = process.env.VERSION;
          const files = fs.readdirSync(releaseDir).filter((entry) => {
            return fs.statSync(path.join(releaseDir, entry)).isFile();
          });

          function assetUrl(fileName) {
            return `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(fileName)}`;
          }

          function signatureFor(fileName) {
            const signatureName = `${fileName}.sig`;
            const signaturePath = path.join(releaseDir, signatureName);

            if (!fs.existsSync(signaturePath)) {
              throw new Error(`Missing updater signature ${signatureName}`);
            }

            return fs.readFileSync(signaturePath, "utf8").trim();
          }

          function findOne(description, predicate) {
            const matches = files.filter(predicate).sort();

            if (matches.length !== 1) {
              throw new Error(`Expected exactly one ${description}, found ${matches.length}: ${matches.join(", ")}`);
            }

            return matches[0];
          }

          const macUpdater = findOne("macOS updater artifact", (file) => file.endsWith(".app.tar.gz"));
          const windowsUpdater = findOne("Windows NSIS updater artifact", (file) => file.endsWith("-setup.exe"));
          const linuxUpdater = findOne("Linux AppImage updater artifact", (file) => file.endsWith(".AppImage"));
          const latest = {
            version,
            notes: `dlsite-manager ${version}`,
            pub_date: new Date().toISOString(),
            platforms: {
              "darwin-aarch64": {
                signature: signatureFor(macUpdater),
                url: assetUrl(macUpdater),
              },
              "windows-x86_64": {
                signature: signatureFor(windowsUpdater),
                url: assetUrl(windowsUpdater),
              },
              "linux-x86_64": {
                signature: signatureFor(linuxUpdater),
                url: assetUrl(linuxUpdater),
              },
            },
          };

          fs.writeFileSync(path.join(releaseDir, "latest.json"), `${JSON.stringify(latest, null, 2)}\n`);
          NODE

          mapfile -d "" files < <(find dist/release -type f -print0 | sort -z)

          flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if [[ "${DRAFT}" == "true" ]]; then
            flags+=(--draft)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" \
              --title "dlsite-manager ${VERSION}" \
              --notes "Automated unsigned build artifacts for dlsite-manager ${VERSION}." \
              "${flags[@]}"
          fi
